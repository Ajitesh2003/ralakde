<!DOCTYPE html>
<html>
<head>
    <title>Clear Storage</title>
</head>
<body>
    <h1>Clear Browser Storage</h1>
    <button onclick="clearStorage()">Clear LocalStorage</button>
    <p id="result"></p>
    
    <script>
        function clearStorage() {
            localStorage.clear();
            document.getElementById('result').innerHTML = 'LocalStorage cleared! Please refresh your main application.';
        }
        
        // Show current storage
        document.write('<h2>Current Storage:</h2>');
        document.write('<pre>' + JSON.stringify(localStorage, null, 2) + '</pre>');
    </script>
</body>
</html>
